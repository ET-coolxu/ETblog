services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
    volumes:
      - ./content:/app/content
      - ./public/uploads:/app/public/uploads
      - ./data:/app/data
    expose:
      - "3000"
    networks:
      - web

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: "${SITE_DOMAIN:-:80}"
      CADDY_EMAIL: ${CADDY_EMAIL:-admin@localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    networks:
      - web

volumes:
  caddy-data:
  caddy-config:

networks:
  web:
