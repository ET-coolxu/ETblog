services:
  app:
    build:
      context: .
      args:
        # 预渲染首页/关于需要构建期站名；密码不要放进 build args。
        SITE_NAME: "${SITE_NAME:-个人博客}"
        AUTHOR_NAME: "${AUTHOR_NAME:-作者}"
        SITE_URL: "${SITE_URL:-http://localhost:3000}"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
    volumes:
      - ./content:/app/content
      - ./public/uploads:/app/public/uploads
      - ./data:/app/data
    expose:
      - "3000"
    networks:
      - web

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: "${SITE_DOMAIN:-:80}"
      CADDY_EMAIL: ${CADDY_EMAIL:-admin@localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    networks:
      - web

volumes:
  caddy-data:
  caddy-config:

networks:
  web:
