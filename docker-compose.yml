services:
  app:
    # 生产由 Actions 推到 GHCR；本地仍可 --build。IMAGE_TAG 默认 latest。
    image: ghcr.io/et-coolxu/etblog:${IMAGE_TAG:-latest}
    build:
      context: .
      args:
        # 预渲染首页/关于需要构建期站名；密码不要放进 build args。
        SITE_NAME: "${SITE_NAME:-个人博客}"
        AUTHOR_NAME: "${AUTHOR_NAME:-作者}"
        SITE_URL: "${SITE_URL:-http://localhost:3000}"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
    volumes:
      - ./content:/app/content
      - ./public/uploads:/app/public/uploads
      # SQLite 数据卷。离线地区库在镜像构建时下载并放在 /app/geo，仓库不收这个大文件。不要改挂到这里，否则会盖住镜像里的文件。
      - ./data:/app/data
    expose:
      - "3000"
    networks:
      - web

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      # 只发布 TCP。UDP 443 留给同机其他服务；本栈走 HTTP/2，不启用 HTTP/3。
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: "${SITE_DOMAIN:-:80}"
      CADDY_EMAIL: ${CADDY_EMAIL:-admin@localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    networks:
      - web

volumes:
  caddy-data:
  caddy-config:

networks:
  web:
